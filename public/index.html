<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="style_client.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agora - Đặt xe</title> 
    <!-- Nhúng thư viện Bản đồ Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
       
</head>
<body>
    <div class="app-layout">
        
        <!-- Header chung (Nút 3 gạch & Logo Agora) -->
        <div class="app-header">
            <div class="menu-icon" onclick="alert('Mở menu')">☰</div>
            <div class="header-agora">AGORA</div>
        </div>

        <!-- Khung Bản đồ (Desktop: bên phải | Mobile: nằm ngay dưới Header trong card bo góc) -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- Khung Form Nhập liệu -->
        <div class="booking-form">
            <!-- 1. Dịch vụ (Đổi mặc định sang Chở người) -->
            <div class="service-tabs">
                <div class="service-tab active-blue" id="tab-ride" onclick="selectService('RIDE')">👤 Chở người</div>
                <div class="service-tab" id="tab-delivery" onclick="selectService('DELIVERY')">📦 Gửi Hàng</div>
            </div>

            <!-- 2. Gán Địa chỉ -->
            <div class="address-box">
                <div class="dotted-line"></div>
                
                <!-- ĐIỂM ĐÓN -->
                <div class="addr-row" style="position: relative;">
                    <div class="dot dot-blue"></div>
                    <input type="text" id="pickupInput" class="addr-input" placeholder="Nhập điểm đón..." oninput="suggestAddress(this.value, 'pickup')"
                    onkeydown="if(event.key === 'Enter') { searchAddress(this.value, 'pickup'); document.getElementById('pickupSuggestions').style.display = 'none'; }">
                    
                    <!-- THÊM NÚT ĐỊNH VỊ VỊ TRÍ HIỆN TẠI -->
                    <button onclick="getCurrentLocation('pickup')" style="background:none; border:none; font-size:18px; cursor:pointer; padding:5px; margin-right:2px;" title="Lấy vị trí hiện tại">🎯</button>
                    
                    <button class="btn-search blue" onclick="searchAddress(document.getElementById('pickupInput').value, 'pickup')">🔍</button>
                    <div id="pickupSuggestions" class="suggestions-list"></div>
                </div>
                
                <!-- Điểm Đến -->
                <div class="addr-row" style="position: relative;">
                    <div class="dot dot-red"></div>
                    <!-- Đổi onkeypress thành oninput -->
                    <input type="text" id="dropoffInput" class="addr-input" placeholder="Nhập điểm đến..." oninput="suggestAddress(this.value, 'dropoff')"
                    onkeydown="if(event.key === 'Enter') { searchAddress(this.value, 'dropoff'); document.getElementById('dropoffSuggestions').style.display = 'none'; }">
                    
                    <button class="btn-search red" onclick="searchAddress(document.getElementById('dropoffInput').value, 'dropoff')">🔍</button>
                    <!-- Hộp xổ xuống kết quả Điểm Đến -->
                    <div id="dropoffSuggestions" class="suggestions-list"></div>
                </div>
            </div>

            <!-- 3. Phương tiện -->
            <div class="vehicle-tabs">
                <div class="v-tab active-orange" id="veh-motor" onclick="selectVehicle('MOTORBIKE')">Xe máy</div>
                <div class="v-tab" id="veh-car" onclick="selectVehicle('CAR')">Ô tô</div>
                <div class="v-tab" id="veh-truck" onclick="selectVehicle('TRUCK')">Xe tải</div>
            </div>

            <!-- 4. Chế độ -->
            <div class="mode-tabs">
                <div class="m-tab active-dark" id="mode-bid" onclick="selectMode('BID')">⚖️ Đấu giá tự do</div>
                <div class="m-tab" id="mode-instant" onclick="selectMode('INSTANT')">⚡ Đi ngay</div>
            </div>

            <!-- 5. Khung Đấu giá -->
            <div class="bidding-section" id="biddingBox">
                <div class="bid-note">Sàn bảo vệ tài xế: 30.000 đ</div>
                <div class="bid-controls">
                    <button class="btn-bid" onclick="adjustPrice(-5000)">-5k</button>
                    <div class="bid-price" id="displayPrice">45.000 đ</div>
                    <button class="btn-bid" onclick="adjustPrice(5000)">+5k</button>
                </div>
            </div>

            <div id="resultBox"></div>

            <!-- Nút Đặt Xe (Thay đổi id để dễ điều khiển chữ) -->
            <button class="btn-main-action" id="mainActionBtn" onclick="bookRide()">TÌM TÀI XẾ</button>
        </div>

    </div>
    
    <!-- Script Bản đồ & Socket -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Nhúng file script  -->
    <script src="script_client.js"></script>
</body>
</html>
