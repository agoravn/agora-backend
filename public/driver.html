<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="style_driver.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agora - Tài xế</title>
</head>
<body>
    <div class="app-container">
        <!-- Header & Ví -->
        <div class="status-bar"><span>09:41</span><span>100%</span></div>
        <div class="header-row">
            <div class="badge-online" id="statusToggleBtn" onclick="toggleStatus()">ONLINE</div>
            <div class="wallet-balance">Ví: 520.000 đ</div>
        </div>

        <!-- KHUNG CUỐC XE MỚI -->
        <div id="tripContainer" style="display: none;">
            <div class="blue-banner" id="topBanner">⚡ CUỐC MỚI • CÒN <span id="countdown">15</span> GIÂY</div>
            
            <!-- Phần nội dung chính (Chứa form giá và địa chỉ) -->
            <div class="main-card" id="cardContent">
                <div class="price-section">
                    <div class="price-title">GIÁ KHÁCH ĐỀ XUẤT</div>
                    <div class="price-value" id="priceDisplay">...</div>
                    <div class="payment-method">TIỀN MẶT</div>
                </div>

                <div class="divider"></div>

                <div class="addr-row">
                    <div class="addr-icon"><div class="dot dot-blue"></div></div>
                    <div class="dotted-line"></div>
                    <div class="addr-info">
                        <div class="addr-sub">ĐIỂM ĐÓN (Cách bạn 400m - 2 phút)</div>
                        <div class="addr-main" id="pickupDisplay">...</div>
                    </div>
                </div>

                <div class="addr-row">
                    <div class="addr-icon"><div class="dot dot-red"></div></div>
                    <div class="addr-info">
                        <div class="addr-sub">ĐIỂM ĐẾN (Lộ trình dự kiến)</div>
                        <div class="addr-main" id="dropoffDisplay">...</div>
                    </div>
                </div>

                <div class="note-box" id="noteDisplay">Khách có 1 vali kéo cỡ vừa</div>

                <!-- CỤM NÚT ĐIỀU KHIỂN (ĐÃ FIX DUY NHẤT 1 BỘ) -->
                <div id="actionButtons">
                    <button id="btnAccept" class="btn-accept" onclick="acceptTrip()">NHẬN NGAY (<span id="btnPriceDisplay">...</span>)</button>

                    <div id="counterSection" class="counter-section">
                        <div class="counter-title">HOẶC BÁN GIÁ CAO HƠN CHO KHÁCH:</div>
                        <div class="counter-grid">
                            <button class="btn-counter" onclick="counterOffer(5000)">
                                <div class="btn-counter-val">+5.000 đ</div>
                                <div class="btn-counter-total" id="calc5k">...</div>
                            </button>
                            <button class="btn-counter" onclick="counterOffer(10000)">
                                <div class="btn-counter-val">+10.000 đ</div>
                                <div class="btn-counter-total" id="calc10k">...</div>
                            </button>
                            <button class="btn-counter" onclick="counterOffer(15000)">
                                <div class="btn-counter-val">+15.000 đ</div>
                                <div class="btn-counter-total" id="calc15k">...</div>
                            </button>
                        </div>
                    </div>

                    <button id="btnReject" class="btn-reject" onclick="ignoreTrip()">BỎ QUA (Không phạt tỉ lệ)</button>
                </div>

                <!-- Màn hình chờ khách xác nhận giá (Mặc định ẩn) -->
                <div id="waitingCustomerBox" style="display: none; text-align: center; padding: 20px 0;">
                    <div style="font-size:30px; margin-bottom:10px;">⏳</div>
                    <h3 id="waitingPriceText" style="color:#2d3436; margin: 0 0 10px 0;">...</h3>
                    <p style="color:#7f8c8d; font-size:14px; margin: 0;">Đang chờ khách xác nhận...</p>
                </div>

                <!-- Nút hoàn thành cuốc xe (Mặc định ẩn) -->
                <button id="btnFinish" class="btn-accept" style="display: none; background: #2980b9;" onclick="finishTrip()">🏁 TRẢ KHÁCH (HOÀN THÀNH)</button>
            </div>
        </div>

        <!-- Màn hình chờ dỗi việc -->
        <div id="idleScreen" style="text-align: center; margin-top: 50px; color: #bdc3c7;">
            <div style="font-size: 50px; margin-bottom: 20px;">☕</div>
            <h3>Đang tìm cuốc xe...</h3>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <!-- Nhúng file script  -->
    <script src="script_driver.js"></script>
</body>
</html>
